[project]
name = "wikirace"
version = "0.1.0"
description = "Wikirace na Wikipédia em português: busca exata contra agentes heurísticos"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "rede: testes que precisam de internet (rodar com -m rede)",
]
addopts = "-m 'not rede'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]  # zip(strict=...) não acrescenta nada aqui
